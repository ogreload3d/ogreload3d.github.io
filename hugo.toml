baseURL = 'https://ogreload3d.github.io/'
locale = 'en-us'
title = "ogreload3d's cool page"

disableKinds = ["sitemap"]
summaryLength = 1

[params]
  author = "ogreload3d"
  theme = 'light-pink'
  [params.read-more]
    length-limit = 0
    [params.read-more.text]
      more = "Read more"
      less = "Read less"

[taxonomies]
  category = 'categories'
  tag = 'tags'

[caches]
  [caches.images]
    dir = ':cacheDir/images'