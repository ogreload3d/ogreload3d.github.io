name: Deploy to dopagaki

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3

      - name: Build with Hugo
        run: hugo --gc --minify --cleanDestinationDir

      - name: rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: public/
          remote_path: ${{ secrets.HUGO_PATH }} # ex: /var/www/html/
          remote_host: ${{ secrets.DOPAGAKI_HOST }} # ex: example.com
          remote_port: ${{ secrets.DOPAGAKI_PORT }} # ex: 22
          remote_user: ${{ secrets.HUGO_USER }} # ex: ubuntu
          remote_key: ${{ secrets.HUGO_KEY }}