        html,

        body {
            display: grid;

        }

        }

        #gate p {

            margin: 0
        }

        #status {
            position: fixed;
            text-align: center;
            color: #777;
            font-size: 11px;
            letter-spacing: .12em;
            pointer-events: none
        }
    </style>
</head>

            function newArrangement() {
                const ids = shuffle(Object.keys(sounds).slice());
                const count = isMobile ? 3 : (3 + Math.floor(Math.random() * (MAX_INSTRUMENTS - 2))); // mobile phones so weak. 3 instruments max, 12 otherwise.
                arrangementCount = count;
                const chosen = ids.slice(0, count);
                const parts = {melody: [chosen[0]], accomp: [chosen[1]], snare: [chosen[2]]};
                for (const id of chosen.slice(3)) parts[['melody', 'accomp', 'snare'][Math.floor(Math.random() * 3)]].push(id);
                return parts;
            }
            let arrangement = null, arrangementCount = 0;
            function runSection(start) {
                if (!playing) return;
                ensureAudio();
                const theme = ['A', 'A', 'B', 'B'][sectionNo % 4];
                arrangement = newArrangement();
                const when = Math.max(audio.currentTime + .035, start);
                scheduleBacking(when, SECTION);
                scheduleMelody(when, theme, arrangement.melody);
                scheduleAccomp(when, arrangement.accomp);
                scheduleSnareLayer(when, arrangement.snare);
                status.textContent = `${theme} ${sectionNo % 4 + 1}/4 · ${arrangementCount} instruments · melody ${arrangement.melody.length}, three-beat ${arrangement.accomp.length}, snare ${arrangement.snare.length}`;
                const duration = SECTION * beat(), wall = performance.now() + Math.max(0, (when - audio.currentTime) * 1000);
                const update = () => {
                    if (!playing) return;
                    const elapsed = (performance.now() - wall) / 1000;
                    if (elapsed >= duration - .12) {sectionNo++; runSection(when + duration);}
                    else timer = setTimeout(update, 80);
                };
                timer = setTimeout(update, 80);
            }
            function start() {
                if (playing) return;
                ensureAudio(); playing = true; sectionNo = 0; gate.classList.add('hidden');
                const introStart = audio.currentTime + .08;
                scheduleBacking(introStart, INTRO);
                status.textContent = 'TWO-BAR INTRO · snare + vamp';
                const wall = performance.now();
                const introUpdate = () => {
                    if (!playing) return;
                    if ((performance.now() - wall) / 1000 >= INTRO * beat() - .04) runSection(introStart + INTRO * beat());
                    else timer = setTimeout(introUpdate, 40);
                };
                timer = setTimeout(introUpdate, 40);
            }
            gate.addEventListener('click', start, {once: true});
            gate.addEventListener('touchend', e => {e.preventDefault(); start();}, {once: true, passive: false});
        })();
    </script>
